
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administración | JEHOVÁ JIREH</title>

  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="admin.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="admin.js" defer></script>
</head>
<body>

  <main class="admin-container">
    <section class="admin-login" id="login-section">
      <h1>JEHOVÁ JIREH</h1>
      <p>Panel privado de administración</p>

      <form id="login-form">
        <label for="email">Correo electrónico</label>
        <input
          type="email"
          id="email"
          placeholder="Tu correo de administrador"
          required
        >

        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          placeholder="Tu contraseña"
          required
        >

        <button type="submit">Iniciar sesión</button>
        <p id="login-message"></p>
      </form>
    </section>

    <section id="dashboard" hidden>
      <header class="admin-header">
        <div>
          <h1>JEHOVÁ JIREH</h1>
          <p>Administración de la tienda</p>
        </div>
        <button id="logout-button" type="button">Cerrar sesión</button>
      </header>

      <div id="admin-content">
        <h2>Panel de administración</h2>
        <p>Bienvenido. Aquí podrás administrar tus productos.</p>
      </div>
    </section>
  </main>

</body>
</html>
